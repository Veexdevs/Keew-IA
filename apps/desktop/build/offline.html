<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Keew IA — offline</title>
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #f2f2f2;
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
      .box { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; }
      .badge { width: 88px; height: 88px; border-radius: 20px; background: #004CFD;
        display: grid; place-items: center; margin: 0 auto 20px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #8d8d8d; font-size: 13px; max-width: 380px; line-height: 1.6; }
      button { margin-top: 18px; background: #004CFD; color: #fff; border: 0;
        padding: 10px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; }
      code { background: #111; padding: 2px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div>
        <div class="badge">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="#fff"><path d="M12 3a9 9 0 1 0 9 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" fill="#fff"/></svg>
        </div>
        <h1>Sem conexão com a Keew</h1>
        <p>
          O app não conseguiu alcançar <code>keew-ia.vercel.app</code>. Verifique sua rede.
          O núcleo local responde a cálculos, datas e resumos assim que a interface carregar em cache.
        </p>
        <button onclick="location.href='https://keew-ia.vercel.app'">Tentar novamente</button>
      </div>
    </div>
  </body>
</html>
